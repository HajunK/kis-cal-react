<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIS Cal</title>
  <link rel="icon" href="/icons/logos/page-icon.png" />
  <!-- Sets data-theme/data-hide-breakdown before the stylesheet (bundled with
       the app, and linked here by Vite when it builds) ever gets a chance to
       paint — deferred scripts don't run until the page has parsed, too late
       to avoid a flash of the wrong appearance. -->
  <script>
    (function () {
      try {
        var prefs = { appearance: "system", showBreakdown: true, showUpcomingAssessments: true };
        var uid = localStorage.getItem("lastKnownUid");
        var raw = uid ? localStorage.getItem("prefs_" + uid) : null;
        if (!raw) raw = localStorage.getItem("prefs_anon");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.prefs) prefs = Object.assign(prefs, parsed.prefs);
        }
        var theme = prefs.appearance;
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
        if (prefs.showBreakdown === false) document.documentElement.dataset.hideBreakdown = "true";
        if (prefs.showUpcomingAssessments === false) document.documentElement.dataset.hideUpcomingAssessments = "true";
      } catch (error) {
        // ignore — worst case is the same flash this exists to prevent
      }
    })();
  </script>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <!-- Inter, hosted here (see the @font-face in tokens.css) and fetched
       first, so it's ready by the first paint and pages never flash the
       browser's font on the way in. -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <!-- The whole app, drawn by React (src/app/main.jsx): the tab bar, the open
       tab and the popups. display: contents (see base.css), so they're laid
       out as the body's own children, as each tab's old page had them. -->
  <div id="app"></div>

  <script type="module" src="/src/app/main.jsx"></script>
  <!-- Firebase's compat SDK, the same version as before; the app starts its
       parts once these have run. -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- Vendored locally rather than loaded from a CDN: a third-party CDN
       script is exactly what an ad blocker or school network filter blocks,
       which broke this before. A same-origin file can't be. -->
  <script defer src="/js/vendor/qrcode-generator.js"></script>
</body>
</html>
